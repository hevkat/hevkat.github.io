<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Wireframe Head</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #ff69c9;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: #ff8bd5;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="hint">Drag to rotate · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.1, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 4;
    controls.maxDistance = 10;
    controls.target.set(0, 0.05, 0);

    const pink = 0xff4fbd;
    const head = new THREE.Group();
    scene.add(head);

    // Head shape: each profile point is [height, half-width, depth].
    const profile = [
      [-1.45, 0.05, 0.08],
      [-1.28, 0.34, 0.42],
      [-0.92, 0.62, 0.66],
      [-0.48, 0.84, 0.76],
      [ 0.08, 0.96, 0.81],
      [ 0.62, 0.91, 0.78],
      [ 1.08, 0.72, 0.65],
      [ 1.42, 0.42, 0.40],
      [ 1.58, 0.05, 0.06]
    ];

    function interpolateProfile(y, column) {
      for (let i = 0; i < profile.length - 1; i++) {
        const a = profile[i];
        const b = profile[i + 1];
        if (y >= a[0] && y <= b[0]) {
          const t = (y - a[0]) / (b[0] - a[0]);
          return a[column] + (b[column] - a[column]) * t;
        }
      }
      return profile[y < profile[0][0] ? 0 : profile.length - 1][column];
    }

    // Build a low-poly surface from horizontal rings.
    const ringCount = 17;
    const segmentCount = 16;
    const vertices = [];
    const indices = [];

    for (let r = 0; r < ringCount; r++) {
      const y = -1.45 + (3.03 * r) / (ringCount - 1);
      const width = interpolateProfile(y, 1);
      const depth = interpolateProfile(y, 2);

      for (let s = 0; s < segmentCount; s++) {
        const angle = (s / segmentCount) * Math.PI * 2;
        const x = Math.sin(angle) * width;
        const z = Math.cos(angle) * depth;
        vertices.push(x, y, z);
      }
    }

    for (let r = 0; r < ringCount - 1; r++) {
      for (let s = 0; s < segmentCount; s++) {
        const a = r * segmentCount + s;
        const b = r * segmentCount + (s + 1) % segmentCount;
        const c = (r + 1) * segmentCount + s;
        const d = (r + 1) * segmentCount + (s + 1) % segmentCount;
        indices.push(a, c, b, b, c, d);
      }
    }

    const headGeometry = new THREE.BufferGeometry();
    headGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(vertices, 3)
    );
    headGeometry.setIndex(indices);
    headGeometry.computeVertexNormals();

    const wireframe = new THREE.Mesh(
      headGeometry,
      new THREE.MeshBasicMaterial({
        color: pink,
        wireframe: true,
        transparent: true,
        opacity: 0.9
      })
    );
    head.add(wireframe);

    // Add simple geometric facial lines on the front of the head.
    const featureMaterial = new THREE.LineBasicMaterial({
      color: 0xff8bd5,
      transparent: true,
      opacity: 0.95
    });

    function addLine(points) {
      const geometry = new THREE.BufferGeometry().setFromPoints(
        points.map(([x, y, z]) => new THREE.Vector3(x, y, z))
      );
      head.add(new THREE.Line(geometry, featureMaterial));
    }

    // Eyes
    addLine([
      [-0.58, 0.27, 0.57], [-0.42, 0.34, 0.67],
      [-0.25, 0.34, 0.73], [-0.10, 0.27, 0.77]
    ]);
    addLine([
      [0.10, 0.27, 0.77], [0.25, 0.34, 0.73],
      [0.42, 0.34, 0.67], [0.58, 0.27, 0.57]
    ]);

    // Nose and mouth
    addLine([
      [0, 0.20, 0.79], [0, -0.08, 0.84], [0.12, -0.27, 0.80],
      [0, -0.32, 0.82], [-0.12, -0.27, 0.80]
    ]);
    addLine([
      [-0.34, -0.60, 0.69], [-0.16, -0.65, 0.77],
      [0, -0.66, 0.79], [0.16, -0.65, 0.77],
      [0.34, -0.60, 0.69]
    ]);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
