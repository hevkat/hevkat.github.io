<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Skull</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #030204;
      color: #f6b4d1;
      font: 13px/1.5 system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      top: 22px;
      left: 24px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #ff7db8;
      pointer-events: none;
    }
    .help {
      position: fixed;
      bottom: 22px;
      left: 24px;
      color: #b98da2;
      pointer-events: none;
    }
    .crosshair {
      position: fixed;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 1px solid #ff7db8;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
    }
    body.over-skull .crosshair { opacity: .8; }
  </style>
</head>
<body>
  <div class="label">Specimen 001 &nbsp; / &nbsp; Interactive study</div>
  <div class="help">DRAG TO DEFORM &nbsp;·&nbsp; SHIFT + DRAG TO PUSH / PULL &nbsp;·&nbsp; SCROLL TO ZOOM</div>
  <div class="crosshair" id="crosshair"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030204);

    const camera = new THREE.PerspectiveCamera(
      38, window.innerWidth / window.innerHeight, 0.1, 100
    );
    camera.position.set(0, 0.05, 5.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const pink = new THREE.MeshBasicMaterial({
      color: 0xff5ca8,
      wireframe: true,
      transparent: true,
      opacity: 0.9
    });

    const brightPink = new THREE.MeshBasicMaterial({
      color: 0xffa4cd,
      wireframe: true,
      transparent: true,
      opacity: 0.95
    });

    const skull = new THREE.Group();
    scene.add(skull);

    // Keep these meshes separate so the sculpting brush can deform them.
    const deformable = [];

    function wireSphere(name, position, scale, segments = 24, rings = 16, material = pink) {
      const geometry = new THREE.SphereGeometry(1, segments, rings);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      skull.add(mesh);
      deformable.push(mesh);
      return mesh;
    }

    // Cranium, cheek area, and lower jaw.
    wireSphere("cranium", [0, 0.20, 0], [0.91, 1.10, 0.76], 28, 20, brightPink);
    wireSphere("face", [0, -0.47, 0.22], [0.68, 0.69, 0.62], 24, 16);
    wireSphere("jaw", [0, -0.88, 0.02], [0.62, 0.37, 0.59], 22, 14, brightPink);

    // Dark sockets sit in front of the wireframe; rings define their edges.
    const socketMaterial = new THREE.MeshBasicMaterial({ color: 0x030204 });
    function socket(x, y, z, sx, sy) {
      const hollow = new THREE.Mesh(
        new THREE.SphereGeometry(1, 24, 16),
        socketMaterial
      );
      hollow.position.set(x, y, z);
      hollow.scale.set(sx, sy, 0.12);
      skull.add(hollow);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(1, 0.035, 6, 32),
        brightPink
      );
      rim.position.set(x, y, z + 0.10);
      rim.scale.set(sx, sy, 1);
      skull.add(rim);
    }
    socket(-0.39, 0.13, 0.68, 0.27, 0.33);
    socket( 0.39, 0.13, 0.68, 0.27, 0.33);

    // Nose opening.
    const nose = new THREE.Mesh(
      new THREE.ConeGeometry(0.15, 0.28, 3),
      socketMaterial
    );
    nose.position.set(0, -0.29, 0.79);
    nose.rotation.x = Math.PI;
    skull.add(nose);

    // Simple wireframe teeth.
    for (let i = 0; i < 8; i++) {
      const x = (i - 3.5) * 0.125;
      const tooth = new THREE.Mesh(
        new THREE.BoxGeometry(0.105, 0.19, 0.10),
        brightPink
      );
      tooth.position.set(x, -0.68, 0.70 - Math.abs(x) * 0.12);
      skull.add(tooth);
    }

    // Soft pink glow behind the skull.
    const glow = new THREE.PointLight(0xff237f, 18, 8);
    glow.position.set(0, 0.2, 2.5);
    scene.add(glow);

    const ambient = new THREE.AmbientLight(0xffffff, 0.25);
    scene.add(ambient);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const crosshair = document.getElementById("crosshair");
    let activeMesh = null;
    let brushCenter = null;
    let lastX = 0;
    let lastY = 0;
    let dragging = false;

    function updatePointer(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      crosshair.style.left = `${event.clientX}px`;
      crosshair.style.top = `${event.clientY}px`;
    }

    function hitSkull() {
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObjects(deformable, false)[0] || null;
    }

    renderer.domElement.addEventListener("pointerdown", event => {
      updatePointer(event);
      const hit = hitSkull();
      if (!hit) return;

      dragging = true;
      activeMesh = hit.object;
      brushCenter = activeMesh.worldToLocal(hit.point.clone());
      lastX = event.clientX;
      lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      updatePointer(event);

      if (!dragging || !activeMesh) {
        document.body.classList.toggle("over-skull", !!hitSkull());
        return;
      }

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;

      const geometry = activeMesh.geometry;
      const positions = geometry.attributes.position;
      const radius = 0.42;
      const strength = 0.003;

      // Screen-space drag direction, converted into the mesh's local space.
      const move = new THREE.Vector3(
        dx * strength,
        -dy * strength,
        event.shiftKey ? -dy * strength : 0
      );
      activeMesh.worldToLocal(
        activeMesh.localToWorld(new THREE.Vector3()).add(move)
      );

      for (let i = 0; i < positions.count; i++) {
        const vertex = new THREE.Vector3().fromBufferAttribute(positions, i);
        const distance = vertex.distanceTo(brushCenter);
        if (distance >= radius) continue;

        const falloff = Math.pow(1 - distance / radius, 2);
        vertex.addScaledVector(move, falloff);
        positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
      }

      positions.needsUpdate = true;
      geometry.computeVertexNormals();
    });

    function stopDragging() {
      dragging = false;
      activeMesh = null;
      brushCenter = null;
    }
    renderer.domElement.addEventListener("pointerup", stopDragging);
    renderer.domElement.addEventListener("pointercancel", stopDragging);

    renderer.domElement.addEventListener("wheel", event => {
      camera.position.z = THREE.MathUtils.clamp(
        camera.position.z + event.deltaY * 0.002, 3.4, 8
      );
    }, { passive: true });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
